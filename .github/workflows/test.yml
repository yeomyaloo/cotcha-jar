# 푸시·PR 마다 타입 검사·빌드와 화면 테스트(Playwright, 예시 API)를 돈다. 백엔드는 필요 없다
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 타입 검사와 빌드
        run: npm run build

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 화면 테스트
        run: npm run test:e2e

      - name: 실패한 테스트 기록 보관
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
